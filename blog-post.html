<!doctype html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="J.Jason 的技术文章归档。">
    <meta name="theme-color" content="#f1e8d2">
    <title>文章归档 — J.Jason</title>
    <link rel="icon" href="assets/profile.png" type="image/png">
    <link rel="stylesheet" href="css/site.css">
</head>
<body class="inner-page">
    <header class="topline">
        <strong><a href="index.html">J.Jason</a></strong>
        <nav aria-label="主导航">
            <a href="index.html#work">项目</a>
            <a href="index.html#blog">文章</a>
            <a href="about.html">关于</a>
            <a href="index.html#contact">联系</a>
        </nav>
        <span class="place">NOTES / ARCHIVE</span>
    </header>

    <main class="archive">
        <div class="archive-inner">
            <span class="page-label">ALL NOTES</span>
            <h1 class="archive-heading">把工具放回问题里，再把判断<em>写下来</em>。</h1>
            <div class="archive-list" id="archive-list">
                <p class="empty-note">正在读取文章列表…</p>
            </div>
        </div>
    </main>

    <footer class="page-footer">
        <div class="page-footer-inner"><span>© 2026 J.Jason · Notes</span><a href="index.html">返回首页</a></div>
    </footer>

    <script src="js/blog-data.js?v=4"></script>
    <script>
        (() => {
            const list = document.getElementById('archive-list');
            if (!list || typeof blogPosts === 'undefined' || !Array.isArray(blogPosts)) {
                if (list) list.innerHTML = '<p class="empty-note">文章列表暂不可用。</p>';
                return;
            }

            list.innerHTML = blogPosts.map((post) => `
                <a class="archive-item" href="${post.link}">
                    <time>${post.date || ''}</time>
                    <div><h2>${post.title || ''}</h2><p>${post.summary || ''}</p></div>
                    <span class="circle-open" aria-hidden="true">↗</span>
                </a>
            `).join('');
        })();
    </script>
    <script src="js/motion.js"></script>
</body>
</html>
